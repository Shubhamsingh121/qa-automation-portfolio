name: QA Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selenium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r selenium-python/requirements.txt
      - name: Run Selenium tests
        run: |
          cd selenium-python
          pytest tests/ -v --html=reports/report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-report
          path: selenium-python/reports/

  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd cypress-js && npm ci
      - name: Run Cypress tests
        run: cd cypress-js && npx cypress run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: cypress-js/cypress/screenshots/

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Newman
        run: npm install -g newman
      - name: Run API tests
        run: newman run postman-api/collections/reqres.postman_collection.json
